# Generate an instrumental A2 for videos that contain only one audio stream.
enabled: true

# Available Demucs models:
#   htdemucs.yaml      - recommended balance of quality and speed
#   htdemucs_ft.yaml   - better vocal separation, about four times slower
#   htdemucs_6s.yaml   - experimental six-stem model
#   hdemucs_mmi.yaml   - older Hybrid Demucs v3 model
#   mdx.yaml           - Demucs MDX challenge model
#   mdx_extra.yaml     - MDX model trained with additional data
#   mdx_q.yaml         - smaller quantized MDX model
#   mdx_extra_q.yaml   - smaller quantized MDX-extra model
model: htdemucs.yaml

segmentSeconds: 7.8
overlap: 0.25
shifts: 0
outputBitrate: 192k

# Keep a light vocal presence in generated instrumental tracks. 0 is a fully
# stripped backing track; 0.1 blends the separated vocal stem at 10% level.
instrumentalVocalMix: 0.1

# Generate an SRT sidecar beside the original media. WhisperX is deliberately
# CPU-only so no CUDA runtime or GPU is required.
scripting:
  enabled: true
  model: large-v3
  # Leave unset to detect the language for every song.
  # language: en

  # Lower values retain quieter sung vocals. Raise this if it produces too
  # many false lyric lines from the instrumental.
  vadOnset: 0.15

  # Shorter chunks reduce Whisper skipping repeated lyric phrases inside long,
  # continuous vocal sections. Both Silero and WhisperX use this duration.
  vadChunkSeconds: 15

  # More decoding candidates improve difficult lyrics at the cost of CPU time.
  beamSize: 8

  # Subtitle layout. Long lyric phrases are split into timed SRT cues after
  # two readable lines instead of preserving WhisperX's entire segment.
  maxLineWidth: 36
  maxLineCount: 2
  minLineWidth: 12

  # Leave unset: a generic prompt can be hallucinated as a lyric in short,
  # low-energy vocal regions.
  # initialPrompt: Karaoke song lyrics.
