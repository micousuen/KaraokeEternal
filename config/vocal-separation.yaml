# Generate an instrumental A2 for videos that contain only one audio stream.
enabled: true

# Available Demucs models:
#   htdemucs.yaml      - recommended balance of quality and speed
#   htdemucs_ft.yaml   - better vocal separation, about four times slower
#   htdemucs_6s.yaml   - experimental six-stem model
#   hdemucs_mmi.yaml   - older Hybrid Demucs v3 model
#   mdx.yaml           - Demucs MDX challenge model
#   mdx_extra.yaml     - MDX model trained with additional data
#   mdx_q.yaml         - smaller quantized MDX model
#   mdx_extra_q.yaml   - smaller quantized MDX-extra model
model: htdemucs.yaml

segmentSeconds: 7.8
overlap: 0.25
shifts: 0
outputBitrate: 192k

# Keep a light vocal presence in generated instrumental tracks. 0 is a fully
# stripped backing track; 0.1 blends the separated vocal stem at 10% level.
instrumentalVocalMix: 0.05

# Generate an SRT sidecar beside the original media. Qwen3-ASR and
# Qwen3-ForcedAligner are deliberately run CPU-only so no CUDA runtime or GPU
# is required.
scripting:
  # Temporarily disabled: CPU transcription is too slow on the server. Managed
  # downloads are queued as soon as their instrumental/transcode work finishes.
  enabled: false
  # HuggingFace repo id for the ASR model (transcription only, no timing).
  model: Qwen/Qwen3-ASR-1.7B
  # HuggingFace repo id for the forced-alignment model that turns the ASR
  # text back into word-level timestamps against the same audio.
  alignerModel: Qwen/Qwen3-ForcedAligner-0.6B
  # Leave unset to detect the language for every song.
  # language: en

  # Silero speech-probability threshold to START a speech region. Lower values
  # retain quieter sung vocals; raise if it produces too many false lyric lines
  # from residual instrumental bleed in the stem.
  vadOnset: 0.10

  # Shorter chunks reduce the ASR model skipping or repeating phrases inside
  # long, continuous vocal sections, and keep every forced-alignment call well
  # under its documented 5-minute-per-call limit. Silero first detects
  # complete vocal regions; those regions are then split losslessly to this
  # maximum ASR duration.
  vadChunkSeconds: 15

  # Number of VAD chunks transcribed in a single forward pass. Higher values
  # improve throughput at the cost of proportionally more memory (each item
  # allocates its own KV cache) - CPU inference here is memory-bandwidth-bound
  # per token, so batching more chunks into one pass amortizes weight reads
  # across more work instead of paying that cost once per chunk. bf16 weights
  # and never loading both models at once free up headroom to spend on this.
  #
  # Benchmarked at 8 on uniform 15s chunks: ~4.6s/chunk, vs ~8.0s/chunk at 2.
  # A real song's VAD-derived chunks vary a lot in length though (silence
  # trimmed, not all 15s), and a batch gets padded to its longest member -
  # measured ~15s/chunk at 16 on a real song, i.e. *worse* than unbatched,
  # almost certainly from padding waste across that much length variance.
  # Raising this past 8 isn't safe until chunks are length-bucketed before
  # batching; lower it back toward 2 if a run runs out of memory.
  batchSize: 8

  # Subtitle layout. Long lyric phrases are split into timed SRT cues after
  # two readable lines instead of preserving the ASR model's entire segment.
  maxLineWidth: 36
  maxLineCount: 2
  minLineWidth: 12
