services:
  karaoke-eternal:
    # Build this image on the TrueNAS host with:
    #   ./scripts/build-truenas-image.sh
    # TrueNAS "Install via YAML" has no access to this repository as a build
    # context, so it must use the image already loaded into Docker's image store.
    image: karaoke-eternal:transcode
    pull_policy: never
    restart: unless-stopped
    # Reap FFmpeg, separator, and WhisperX subprocesses reliably. Without an
    # init process, long preprocessing runs can eventually fail with ECHILD.
    init: true
    depends_on:
      - youtube-pot-provider

    environment:
      # TrueNAS SCALE's default apps user/group. Change these if your
      # datasets are owned by a different UID/GID.
      PUID: "568"
      PGID: "568"
      TZ: "America/New_York"
      # Parse filenames as singer-song-language and scan metadata in parallel.
      KES_FILENAME_FORMAT: artist-title-language
      KES_SCAN_WORKERS: "8"
      KES_PATH_TRANSCODE: /transcode
      # FFmpeg tuning for the browser-compatible H.264 output.
      KES_TRANSCODE_PRESET: veryfast
      KES_TRANSCODE_CRF: "20"
      KES_TRANSCODE_AUDIO_BITRATE: 192k
      KES_TRANSCODE_MAX_SIZE_GB: "8"
      KES_PRECACHE_COUNT: "5"
      # Anonymous public-video downloads. PO tokens are generated by the
      # private sidecar; no YouTube account or cookie maintenance is needed.
      KES_PATH_DOWNLOADS: /downloads
      KES_YOUTUBE_MAX_DURATION: "300"
      KES_YOUTUBE_POT_PROVIDER_URL: http://youtube-pot-provider:4416
      # WhisperX runs on CPU with int8 inference and batch size 1.
      KES_PATH_WHISPERX: /opt/whisperx/bin/whisperx

    ports:
      # Change 10188 if that host port is already in use.
      - "10188:8080"

    volumes:
      # Replace "tank" with your TrueNAS pool name. This path must be
      # writable by PUID/PGID because it contains the SQLite database.
      - /mnt/Pool/applications/karaokeeternal/config:/config

      # Replace this with your read-only or writable media dataset.
      # Add /media as a Media Folder inside Karaoke Eternal.
      - /mnt/Pool2/Media/KTV:/media

      # Dedicated dataset for downloaded videos. Replace this host path and
      # keep it writable by PUID/PGID. The app adds /downloads to its library
      # automatically when the first download starts.
      - /mnt/Pool/applications/karaokeeternal/downloads:/downloads

      # Disk-backed transcode cache. Replace this host path independently of
      # the config and media datasets. It must be writable by PUID/PGID.
      - /mnt/Pool/applications/karaokeeternal/transcode:/transcode

  youtube-pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    pull_policy: if_not_present
    restart: unless-stopped
    init: true
    # Port 4416 deliberately remains private to this Compose application.
