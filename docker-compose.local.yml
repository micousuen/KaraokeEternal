services:
  karaoke-eternal:
    container_name: karaoke-eternal-local
    build:
      context: .
    image: karaoke-eternal:transcode
    restart: unless-stopped
    init: true
    depends_on:
      - youtube-pot-provider

    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
      KES_FILENAME_FORMAT: artist-title-language
      KES_SCAN_WORKERS: "4"
      KES_PATH_TRANSCODE: /transcode
      KES_TRANSCODE_PRESET: veryfast
      KES_TRANSCODE_CRF: "20"
      KES_TRANSCODE_AUDIO_BITRATE: 192k
      KES_TRANSCODE_MAX_SIZE_GB: "8"
      KES_PRECACHE_COUNT: "5"
      KES_PATH_DOWNLOADS: /downloads
      KES_YOUTUBE_POT_PROVIDER_URL: http://youtube-pot-provider:4416

    ports:
      - "8080:8080"

    volumes:
      - ./test_folder/config:/config
      - ./test_folder/media:/media
      - ./test_folder/downloads:/downloads
      - ./test_folder/transcode:/transcode

  # Sidecar that runs BotGuard on demand so yt-dlp can attach a valid PO token
  # to YouTube download requests. Without this, YouTube's SABR gate returns
  # HTTP 403 mid-stream for higher-quality DASH formats.
  youtube-pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    pull_policy: if_not_present
    restart: unless-stopped
    init: true
    # Port 4416 deliberately remains private to this Compose application.
